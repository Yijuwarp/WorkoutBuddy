<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkoutBuddy Exercise & Image Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0E14;
            --surface-dark: #161B26;
            --surface-card: #161B26;
            --surface-hover: #1E2533;
            --border-light: #2A3142;
            --text-main: #F1F5F9;
            --text-muted: #8A94A6;
            
            --cat-push: #3B82F6;
            --cat-pull: #22C55E;
            --cat-lower: #FBBF24;
            --cat-full: #A855F7;
            --cat-cardio: #FF4D5E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Header & Hero */
        header {
            background: linear-gradient(180deg, rgba(22, 27, 38, 0.95) 0%, rgba(11, 14, 20, 0.98) 100%);
            border-bottom: 1px solid var(--border-light);
            padding: 24px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title span {
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            background: var(--surface-hover);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 20px;
            -webkit-text-fill-color: var(--text-main);
        }

        .stats-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-pill {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill.push { color: var(--cat-push); border-color: rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.1); }
        .stat-pill.pull { color: var(--cat-pull); border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.1); }
        .stat-pill.lower { color: var(--cat-lower); border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.1); }
        .stat-pill.full { color: var(--cat-full); border-color: rgba(168, 85, 247, 0.3); background: rgba(168, 85, 247, 0.1); }
        .stat-pill.cardio { color: var(--cat-cardio); border-color: rgba(255, 77, 94, 0.3); background: rgba(255, 77, 94, 0.1); }

        /* Controls Row */
        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--cat-push);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--text-main);
            color: var(--bg-dark);
            border-color: var(--text-main);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .filter-btn[data-cat="PUSH"].active { background: var(--cat-push); color: #fff; border-color: var(--cat-push); }
        .filter-btn[data-cat="PULL"].active { background: var(--cat-pull); color: #fff; border-color: var(--cat-pull); }
        .filter-btn[data-cat="LOWER_BODY"].active { background: var(--cat-lower); color: #000; border-color: var(--cat-lower); }
        .filter-btn[data-cat="FULL_BODY"].active { background: var(--cat-full); color: #fff; border-color: var(--cat-full); }
        .filter-btn[data-cat="CARDIO"].active { background: var(--cat-cardio); color: #fff; border-color: var(--cat-cardio); }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 32px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Card Design - Properly Sized Square 1:1 Images */
        .card {
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        /* 1:1 Square Image Container */
        .card-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #090C11;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-image-wrapper img {
            transform: scale(1.05);
        }

        .image-filename-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94A3B8;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .exercise-title {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .badge-PUSH { background: rgba(59, 130, 246, 0.2); color: var(--cat-push); border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-PULL { background: rgba(34, 197, 94, 0.2); color: var(--cat-pull); border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-LOWER_BODY { background: rgba(251, 191, 36, 0.2); color: var(--cat-lower); border: 1px solid rgba(251, 191, 36, 0.4); }
        .badge-FULL_BODY { background: rgba(168, 85, 247, 0.2); color: var(--cat-full); border: 1px solid rgba(168, 85, 247, 0.4); }
        .badge-CARDIO { background: rgba(255, 77, 94, 0.2); color: var(--cat-cardio); border: 1px solid rgba(255, 77, 94, 0.4); }

        .sub-badges {
            display: flex;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            flex-wrap: wrap;
        }

        .sub-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .description {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .yt-link {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #FF4D5E;
            text-decoration: none;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            transition: opacity 0.2s ease;
        }

        .yt-link:hover {
            opacity: 0.8;
        }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>

            <div class="controls-row">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search by exercise name, body part, or image filename...">
                </div>

                <div class="filter-buttons">

            </div>
        </div>
    </header>

    <main>

        let currentCategory = 'ALL';
        let searchQuery = '';

        // Count category stats
        const counts = { PUSH: 0, PULL: 0, LOWER_BODY: 0, FULL_BODY: 0, CARDIO: 0 };
        exercises.forEach(ex => {
            if (counts[ex.category] !== undefined) {
                counts[ex.category]++;
            }
        });

        document.getElementById('cnt-push').textContent = counts.PUSH;
        document.getElementById('cnt-pull').textContent = counts.PULL;
        document.getElementById('cnt-lower').textContent = counts.LOWER_BODY;
        document.getElementById('cnt-full').textContent = counts.FULL_BODY;
        document.getElementById('cnt-cardio').textContent = counts.CARDIO;
        document.getElementById('total-count-badge').textContent = exercises.length + " Exercises";

        function renderExercises() {
            const grid = document.getElementById('exercise-grid');
            grid.innerHTML = '';

            const filtered = exercises.filter(ex => {
                const matchesCat = (currentCategory === 'ALL') || (ex.category === currentCategory);
                const query = searchQuery.toLowerCase();
                const matchesSearch = ex.name.toLowerCase().includes(query) || 
                                     ex.body_part.toLowerCase().includes(query) ||
                                     ex.res_name.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No matching exercises found.</div>';
                return;
            }

            filtered.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'card';

                const catBadgeClass = 'badge-' + ex.category;
                const catDisplay = ex.category.replace('_', ' ');

                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${ex.rel_img_path}" alt="${ex.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x200/1E2533/8A94A6?text=${encodeURIComponent(ex.name)}'">
                        <div class="image-filename-tag">📷 ${ex.res_name}</div>
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="exercise-title">${ex.name}</div>
                            <span class="badge ${catBadgeClass}">${catDisplay}</span>
                        </div>
                        <div class="sub-badges">
                            <span class="sub-badge">${ex.body_part}</span>
                            <span class="sub-badge">${ex.type}</span>
                            <span class="sub-badge">${ex.impact} Impact</span>
                        </div>
                        <div class="description">${ex.description}</div>
                        ${ex.youtube ? `<a href="${ex.youtube}" target="_blank" rel="noopener" class="yt-link">▶ Watch Demo Video</a>` : ''}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Filter button clicks
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-cat');
                renderExercises();
            });
        });

        // Search input
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderExercises();
        });

        // Initial render
        renderExercises();
    </script>
